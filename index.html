<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Cambio de Turno</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Solicitud de Cambio de Turno</h1>
      <p class="subtitulo">Completa el formulario para registrar tu solicitud</p>
    </header>

    <form id="formCambioTurno" class="formulario" novalidate>
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez" />

      <label for="identificacion">Número de identificación</label>
      <input type="text" id="identificacion" name="identificacion" required
             inputmode="numeric" placeholder="Ej: 1030123456" />

      <label for="turnoActual">Turno actual</label>
      <select id="turnoActual" name="turnoActual" required>
        <option value="">Selecciona una opción</option>
        <option value="mañana">Mañana</option>
        <option value="tarde">Tarde</option>
        <option value="noche">Noche</option>
      </select>

      <label for="turnoPropuesto">Turno propuesto</label>
      <select id="turnoPropuesto" name="turnoPropuesto" required>
        <option value="">Selecciona una opción</option>
        <option value="mañana">Mañana</option>
        <option value="tarde">Tarde</option>
        <option value="noche">Noche</option>
      </select>

      <label for="fechaCambio">Fecha del cambio</label>
      <input type="date" id="fechaCambio" name="fechaCambio" required />

      <label for="observaciones">Justificación / observaciones</label>
      <textarea id="observaciones" name="observaciones" rows="4"
                placeholder="Explica brevemente el motivo del cambio"></textarea>

      <p id="mensajeError" class="mensaje-error" role="alert" hidden></p>
      <p id="mensajeExito" class="mensaje-exito" role="status" hidden></p>

      <button type="submit" class="boton-primario">Enviar solicitud</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
